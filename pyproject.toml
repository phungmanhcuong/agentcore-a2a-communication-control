[project]
name = "agentcore-agent-teams"
version = "0.1.0"
requires-python = ">=3.13"
description = "Agent teams on Bedrock AgentCore: Strands, A2A with config allow rules, cheap OpenRouter models"
dependencies = [
    "boto3>=1.43.111",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "strands-agents[a2a,openai]>=1.59.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/act_teams"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls OpenRouter with real models and costs a few cents (needs OPENROUTER_API_KEY_FILE)"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC221", "E501"]
